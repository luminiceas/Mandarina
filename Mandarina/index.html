<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mandarina</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --celeste: #ca93a1;
      --celeste-oscuro: #ca94a1;
      --texto: #ca94a1;
      --papel: #f0ede1;
      --borde: #ca94a1;
      --sombra: rgba(18,34,60,0.06);
      --fondo-seccion: #efece0;
      --fondo-segunda: #ffdee7;
    }
    *{box-sizing:border-box}

    body{
      font-family: 'Montserrat',system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;
      background:var(--fondo-seccion);
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      color:var(--texto)
    }

    .stage{width:100%; max-width:920px; text-align:center}

    .note-thumb{cursor:pointer; display:inline-block; transition:transform .28s;}
    .note-thumb:hover{transform:translateY(-6px) scale(1.02)}
    .note-thumb img{display:block; width:300px; max-width:80vw; height:auto}

    .title{margin-top:12px; font-weight:600; color:#efc352;}

    .sheet-wrap{
      display:none;
      position:fixed;
      inset:0;
      background:var(--fondo-segunda);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      overflow-y:auto;
      padding:20px;
    }

    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .heart{
      position:absolute;
      top:-40px;
      color:white;
      opacity:0.8;
      animation:fall linear forwards;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh);
        opacity:0.2;
      }
    }

    .sheet{
      position:relative;
      margin:20px auto;
      width:420px;
      max-width:100%;
      background:var(--papel);
      border-radius:14px;
      border:6px solid var(--celeste);
      box-shadow:0 18px 40px var(--sombra);
      padding:36px 30px;
      overflow:visible;
      z-index:1
    }

    .sheet::after{
      content:'';
      position:absolute;
      top:-35px;
      right:-35px;
      width:120px;
      height:120px;
      background:url('sello de baby shower 4.png') no-repeat center/contain;
      transform:rotate(15deg);
      z-index:2;
      pointer-events:none;
    }

    .sheet h1{
      font-family:'Playfair Display', serif;
      margin:6px 0 12px;
      font-size:30px;
      color:#ca94a1
    }

    .sheet img.foto{
      width:100%;
      border-radius:10px;
      margin:10px 0 16px;
      object-fit:cover;
    }

    /* 🔴 TEXTO SIN RECUADRO Y CENTRADO */
    .letter{
      background:none;
      border:none;
      padding:0;
      text-align:center;
    }

    .letter p{
      line-height:1.6;
      font-size:16px;
      margin:10px 0 0;
    }

    .back-btn{
      margin-top:14px;
      background:var(--celeste);
      border:none;
      padding:10px 18px;
      border-radius:12px;
      color:white;
      font-weight:600;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(124,160,200,0.15)
    }

    @media (max-width:560px){
      body{padding:16px;}

      .sheet{
        width:100%;
        padding:22px 18px;
      }

      .sheet h1{font-size:24px;}

      .letter p{font-size:14px;}

      .sheet::after{
        width:80px;
        height:80px;
        top:-20px;
        right:-20px;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="thumb" class="note-thumb" title="Te llegó esta notita">
      <img src="fotico.jpg" alt="notita"/>
    </div>
    <div class="title">Has encontrado el link correcto :)</div>

    <div id="sheetWrap" class="sheet-wrap">
      <div class="hearts" id="hearts"></div>

      <div class="sheet">
        <h1>Soy una niña</h1>

        <img src="helita.png" alt="foto" class="foto">

        <div class="letter">
          <p>Ya conoces el sexo de nuestra pequeña Héloïse.</p>
        </div>
      </div>

      <button id="backBtn" class="back-btn">Regresar</button>
    </div>
  </div>

  <script>
    const thumb = document.getElementById('thumb');
    const sheetWrap = document.getElementById('sheetWrap');
    const heartsContainer = document.getElementById('hearts');
    const backBtn = document.getElementById('backBtn');

    let heartsInterval = null;

    thumb.addEventListener('click', ()=>{
      thumb.style.display = 'none';
      document.querySelector('.title').style.display = 'none';
      sheetWrap.style.display = 'flex';
      startRain();
    });

    backBtn.addEventListener('click', ()=>{
      sheetWrap.style.display = 'none';
      thumb.style.display = 'inline-block';
      document.querySelector('.title').style.display = 'block';
      stopRain();
    });

    function createHeart(){
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '♡';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (12 + Math.random()*14) + 'px';
      heart.style.animationDuration = (8 + Math.random()*6) + 's';

      heartsContainer.appendChild(heart);

      setTimeout(()=> heart.remove(), 15000);
    }

    function startRain(){
      stopRain();
      heartsInterval = setInterval(createHeart, 250);
    }

    function stopRain(){
      if(heartsInterval){
        clearInterval(heartsInterval);
        heartsInterval = null;
      }
      heartsContainer.innerHTML = '';
    }
  </script>
</body>
</html>
